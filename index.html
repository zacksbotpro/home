<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZACKSBOT PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07040f; --panel:rgba(14,8,30,.8);
  --cyan:#00f0ff; --pink:#ff2bd6; --yellow:#fcee0a; --green:#25d366; --text:#e8e6ff; --muted:#8b84b8;
  --r:16px;   /* radius sama untuk semua border */
  --line:1px; /* ketebalan sama untuk semua border */
  --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-weight:500;
  display:flex;align-items:center;justify-content:center;padding:12px;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
[hidden]{display:none!important}

.card{position:relative;z-index:2;width:100%;max-width:320px;padding:14px 14px 16px;text-align:center;
  background:var(--panel);backdrop-filter:blur(6px);
  border:var(--line) solid var(--cyan);border-radius:var(--r);
  box-shadow:0 0 30px rgba(0,240,255,.25), inset 0 0 40px rgba(255,43,214,.08)}

.logo img{display:block;width:min(120px,36%);height:auto;margin:0 auto;mix-blend-mode:screen}
.dev{margin-top:2px;font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:500}

.status{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:4px 14px;
  border:var(--line) solid var(--yellow);border-radius:var(--r);
  color:var(--yellow);font-weight:700;font-size:11px;letter-spacing:.18em}
.status i{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:10px 0 8px;
  border:var(--line) solid rgba(0,240,255,.45);border-radius:var(--r);background:rgba(0,0,0,.35)}
.tabbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 6px;cursor:pointer;
  font-family:var(--font);font-weight:700;font-size:12px;letter-spacing:.1em;
  border:0;border-radius:calc(var(--r) - 4px);background:transparent;transition:background .2s,color .2s}
.tabbtn svg{width:18px;height:18px;flex:none}
.tabbtn.tg{color:#4db5f5}
.tabbtn.wa{color:var(--green)}
.tabbtn.tg.active{color:#fff;background:linear-gradient(90deg,#1ea1f2,#2b7bff);box-shadow:0 0 18px rgba(30,161,242,.45)}
.tabbtn.wa.active{color:#fff;background:linear-gradient(90deg,#25d366,#128c7e);box-shadow:0 0 18px rgba(37,211,102,.45)}

.qrbox{padding:10px;border:var(--line) solid rgba(0,240,255,.55);border-radius:var(--r);background:rgba(0,0,0,.35)}
.qrbox p{font-size:12px;color:var(--text)}
.qrbox p b{color:var(--cyan);font-weight:700}
/* border QR menempel tepat pada gambar QR */
.qrbox img{display:block;width:130px;max-width:55%;height:auto;aspect-ratio:1;margin:8px auto 0;
  border:var(--line) solid var(--pink);border-radius:var(--r);box-shadow:0 0 22px rgba(255,43,214,.5)}
.qrbox.wa{border-color:rgba(37,211,102,.6)}
.qrbox.wa p b{color:var(--green)}
.qrbox.wa img{border-color:var(--green);box-shadow:0 0 22px rgba(37,211,102,.5)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:8px;padding:10px;
  border:var(--line) solid transparent;border-radius:var(--r);
  font-family:var(--font);font-weight:700;font-size:11px;letter-spacing:.1em;text-decoration:none;color:#fff;
  background:linear-gradient(90deg,#1ea1f2,#2b7bff);box-shadow:0 0 18px rgba(30,161,242,.45);
  transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.15);transform:translateY(-2px)}
.btn svg{width:18px;height:18px;flex:none}
.btn.wa{background:linear-gradient(90deg,#25d366,#128c7e);box-shadow:0 0 18px rgba(37,211,102,.45)}
.btn.ghost{background:rgba(0,0,0,.3);color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 14px rgba(0,240,255,.2)}
.btn.ghost svg{fill:none;stroke:currentColor;stroke-width:2}

.user{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding:6px 10px;
  text-align:left;border:var(--line) solid var(--pink);border-radius:var(--r);background:rgba(0,0,0,.35)}
.user small{display:block;font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:600}
.user strong{font-size:15px;font-weight:700;color:var(--text)}
.copy{flex:none;width:34px;height:34px;cursor:pointer;color:var(--pink);background:transparent;
  border:var(--line) solid var(--pink);border-radius:calc(var(--r) - 4px);display:grid;place-items:center;transition:background .2s}
.copy:hover{background:rgba(255,43,214,.18)}
.copy svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.copy.ok{color:var(--yellow);border-color:var(--yellow)}
.btn:focus-visible,.copy:focus-visible,.tabbtn:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.foot{margin-top:12px;font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){.status i{animation:none}}
</style>
</head>

<script>
const cp = document.getElementById('copy');
cp.addEventListener('click', async () => {
  const t = document.getElementById('uname').textContent;
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(document.getElementById('uname'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges();
  }
  cp.classList.add('ok'); setTimeout(() => cp.classList.remove('ok'), 1200);
});

// Background trading: candlestick bergerak + grid + garis harga
const c = document.getElementById('bg'), x = c.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, candles = [], step = 16, offset = 0;
function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; seed(); }
function next(p){
  const o = p, cl = o + (Math.random() - .48) * H * .035;
  return { o, c: cl, h: Math.max(o, cl) + Math.random() * H * .02, l: Math.min(o, cl) - Math.random() * H * .02 };
}
function seed(){
  candles = []; let p = H * .55;
  for (let i = 0; i < Math.ceil(W / step) + 3; i++){
    const k = next(p); p = Math.min(H * .8, Math.max(H * .25, k.c)); candles.push(k);
  }
}
function draw(){
  x.fillStyle = '#07040f'; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(W / 2, H * .4, 0, W / 2, H * .4, H);
  g.addColorStop(0, 'rgba(120,20,140,.28)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(0,240,255,.07)'; x.lineWidth = 1;
  for (let i = 0; i < W; i += 48){ x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }
  for (let j = 0; j < H; j += 48){ x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }
  x.globalAlpha = .55;
  candles.forEach((k, i) => {
    const px = i * step - offset, up = k.c >= k.o, col = up ? '#00f0ff' : '#ff2bd6';
    x.strokeStyle = x.fillStyle = col; x.shadowColor = col; x.shadowBlur = 8;
    x.beginPath(); x.moveTo(px + 5, k.h); x.lineTo(px + 5, k.l); x.stroke();
    x.fillRect(px + 1, Math.min(k.o, k.c), 8, Math.max(2, Math.abs(k.c - k.o)));
  });
  x.shadowBlur = 0;
  x.globalAlpha = .9; x.strokeStyle = '#fcee0a'; x.lineWidth = 1.5; x.beginPath();
  candles.forEach((k, i) => { const px = i * step - offset + 5; i ? x.lineTo(px, k.c) : x.moveTo(px, k.c); });
  x.stroke(); x.globalAlpha = 1;
}
function loop(){
  offset += .35;
  if (offset >= step){
    offset = 0; candles.shift();
    const last = candles[candles.length - 1].c;
    candles.push(next(Math.min(H * .8, Math.max(H * .25, last))));
  }
  draw(); requestAnimationFrame(loop);
}
addEventListener('resize', resize); resize();
still ? draw() : loop();
</script>
